<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
	th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">
<head>
<meta charset="UTF-8">
<title>勤怠情報変更｜LMS</title>
</head>
<body>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	</th:block>

	<div class="row">
		<div class="bs-component col-sm-12">

			<form th:action="@{/attendance/update}" th:object="${attendanceForm}" method="post">
				<!--田中涼夢 – Task.27-->
				<ul>
					<!--メッセージが空文字のエラーはメッセージリストを表示しない-->
					<li th:each="error:${#fields.detailedErrors()}" th:if="${!#strings.isEmpty(error.message)}" class="errorMsg">
						<span th:text="${error.message}" ></span>
					</li>
				</ul>
				<!--田中涼夢 – Task.27 ここまで-->
				<table class="table table-hover dataTable no-footer">
					<!--田中涼夢 – Task.29-->
					<!--theadタグにStyle要素を追加 ブロック要素にする-->
					<thead style="display: block;">
						<tr>
							<th class="w140">日付</th>
							<th class="w140">コース内容</th>
							<th class="w60"></th> <!--田中涼夢 – Task.28-->
							<th class="w70">出勤</th>
							<!--田中涼夢 – Task.26-->
							<th></th>
							<th class="w70"></th>
							<!--田中涼夢 – Task.26 ここまで-->
							<th class="w70">退勤</th>
							<!--田中涼夢 – Task.26-->
							<th></th>
							<th class="w70"></th>
							<!--田中涼夢 – Task.26 ここまで-->
							<th class="w100">中抜け時間</th>
							<th class="w70">ステータス</th>
							<th class="w140">備考</th>
						</tr>
					</thead>
					<!--田中涼夢 – Task.29-->
					<!--tbodyタグにStyle要素を追加 ブロック要素にしてスクロールとその高さを指定-->
					<tbody style="display: block; overflow-y: scroll; height: 565px;">
						<th:block th:each="dailyAttendanceForm, stat : *{attendanceList}">
							<tr>
								<th:block>
									<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|" th:value="${dailyAttendanceForm.isToday}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].studentAttendanceId|" th:value="${dailyAttendanceForm.studentAttendanceId}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|" th:value="${dailyAttendanceForm.trainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|" th:value="${dailyAttendanceForm.dispTrainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|" th:value="${dailyAttendanceForm.sectionName}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|" th:value="${dailyAttendanceForm.statusDispName}" />
								</th:block>
								<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>
								<td class="w140">[[${dailyAttendanceForm.sectionName}]]</td>
								
								<!--田中涼夢 – Task.28-->
								<!--${stat.index}でクリックした位置を指定-->
								<td class="w60">
									<button type="button" th:onclick="|FixedTime(${stat.index})|" class="btn btn-success default-button" >定時</button>
								</td>
								<!--田中涼夢 – Task.28 ここまで-->
								
								<!--田中涼夢 – Task.26-->
								<!--出勤時間(時)-->
								<td class="w70">
									<select th:id="|attendanceList[${stat.index}].startTimeHour|" th:name="|attendanceList[${stat.index}].trainingStartTimeHour|" class="form-control"  th:errorclass="errorInput" />
										<option th:each="hourMap : ${attendanceForm.hourMap}" th:value="${hourMap.key}" th:inlne="text" class="form-control"
										th:selected="${hourMap.key == dailyAttendanceForm.trainingStartTimeHour}">[[${hourMap.value}]]</option>
									</select>
								</td>
								<td>:</td>
								<!--出勤時間(分)-->
								<td class="w70">
									<select th:id="|attendanceList[${stat.index}].startTimeMinute|" th:name="|attendanceList[${stat.index}].trainingStartTimeMinute|" class="form-control" th:errorclass="errorInput"/>
										<option th:each="minuteMap : ${attendanceForm.minuteMap}" th:value="${minuteMap.key}" th:inlne="text" class="form-control" 
											th:selected="${minuteMap.key == dailyAttendanceForm.trainingStartTimeMinute}">[[${minuteMap.value}]]</option>
									</select>
								</td>
								
								<!--退勤時間(時)-->
								<td class="w70">
									<select th:id="|attendanceList[${stat.index}].endTimeHour|" th:name="|attendanceList[${stat.index}].trainingEndTimeHour|" class="form-control" th:errorclass="errorInput"/>
										<option th:each="hourMap : ${attendanceForm.hourMap}" th:value="${hourMap.key}" th:inlne="text" class="form-control" 
											th:selected="${hourMap.key == dailyAttendanceForm.trainingEndTimeHour}">[[${hourMap.value}]]</option>
									</select>
								</td>
								<td>:</td>
								<!--退勤時間(分)-->
								<td class="w70">
									<select th:id="|attendanceList[${stat.index}].endTimeMinute|" th:name="|attendanceList[${stat.index}].trainingEndTimeMinute|" class="form-control" th:errorclass="errorInput"/>
										<option th:each="minuteMap : ${attendanceForm.minuteMap}" th:value="${minuteMap.key}" th:inlne="text" class="form-control" 
											th:selected="${minuteMap.key == dailyAttendanceForm.trainingEndTimeMinute}">[[${minuteMap.value}]]</option>
									</select>
								</td>
								<!--ここまで　田中涼夢 – Task.26-->
								
								<td class="w100">
									<select th:name="|attendanceList[${stat.index}].blankTime|" class="form-control">
										<option th:each="blankTime : ${attendanceForm.blankTimes}" th:value="${blankTime.key}" th:inlne="text" class="form-control" 
											th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">[[${blankTime.value}]]</option>
									</select>
								</td>
								<td class="w70">[[${dailyAttendanceForm.statusDispName}]]</td>
								<td class="w140">
									<input type="text" th:name="|attendanceList[${stat.index}].note|" th:value="${dailyAttendanceForm.note}" class="form-control" th:errorclass="errorInput"></input>
								</td>
							</td>
						</th:block>
					</tbody>
				</table>
				<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>
					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>
					<input type="submit" value="更新" name="complete" class="btn btn-info" />
				</div>

			</form>
		</div>
	</div>

<!--田中涼夢 – Task.28-->
    <script th:inline="javascript">
		
		function FixedTime(index){
			//クリックされた位置のプルダウンを指定し、定時のselect要素を指定。
			const AddFixedStartTimeHour = document.getElementById("attendanceList["+index+"].startTimeHour").selectedIndex = 10;
			const AddFixedStartTimeMinute = document.getElementById("attendanceList["+index+"].startTimeMinute").selectedIndex = 1;
			const AddFixedEndTimeHour = document.getElementById("attendanceList["+index+"].endTimeHour").selectedIndex = 19;
			const AddFixedEndTimeMinute = document.getElementById("attendanceList["+index+"].endTimeMinute").selectedIndex = 1;
		}
		
    </script>

</body>
</html>
